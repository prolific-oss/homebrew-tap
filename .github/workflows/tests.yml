name: Lint & Test
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # setup-homebrew taps this repo itself, but needs a token to fetch it since it's private.
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@9af03b7ae3f9e2ae5c174f659d5c3909f7e7dbac # 2026.07.29.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Homebrew Cellar path
        id: brew-cellar
        run: echo "path=$(brew --cellar)" >> "$GITHUB_OUTPUT"

      - name: Cache Homebrew dependencies
        id: cache-deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.set-up-homebrew.outputs.gems-path }}
            ${{ steps.brew-cellar.outputs.path }}
          key: ${{ runner.os }}-brew-deps-${{ steps.set-up-homebrew.outputs.gems-hash }}-${{ hashFiles('Brewfile') }}

      - name: Install Homebrew dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          brew install-bundler-gems
          brew bundle install --file=Brewfile

      - run: make lint

      - run: make test

      # Keep prolific-cli out of the cached Cellar
      # it's not a Brewfile dependency, so a cache hit next run would restore it unlinked.
      - run: make uninstall
        if: always()
